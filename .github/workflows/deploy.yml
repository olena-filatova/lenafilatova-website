name: Deploy preview to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
# cancel-in-progress would abort a Pages deployment that is already running.
# GitHub keeps that half-finished deployment registered against the environment,
# and the next run then queues behind it and times out. Two merges landing a few
# minutes apart is enough to trigger it — which is exactly what took the site
# down on 6 Aug. Queue instead of cancelling: a deploy here takes ~9 minutes, so
# waiting one out is cheap next to a failed deploy.
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: withastro/action@v3
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        # The 10-minute timeout is a hard cap in deploy-pages — values above
        # 600000 ms are silently clamped, so raising it is not an option. The
        # deploy has to fit inside the window: keep the built artifact small
        # (images are the bulk of it — see OPS-205).
        uses: actions/deploy-pages@v4
